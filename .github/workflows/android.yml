# Compila la app de Android de MoiMoi (Capacitor) y la publica en la versión "android":
# https://github.com/carok19/moimoi/releases/tag/android
#
# La app separa las pistas dentro del celular: acá se descarga el modelo Demucs (htdemucs_6s),
# se convierte a ONNX (scripts/android/modelo_demucs.py), se prueba contra el original y se mete
# dentro del APK.
name: App Android

on:
  push:
    paths:
      - 'frontend/**'
      - 'scripts/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # ---- modelo de separación ------------------------------------------------------------

      - name: Modelo de separación (guardado de compilaciones anteriores)
        id: modelo
        uses: actions/cache@v4
        with:
          path: modelo
          key: modelo-htdemucs_6s-${{ hashFiles('scripts/android/modelo_demucs.py') }}-torch2.14-demucs4.1.0

      - uses: actions/setup-python@v5
        if: steps.modelo.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Convertir Demucs a ONNX
        if: steps.modelo.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install demucs==4.1.0 onnx==1.23.0 onnxruntime==1.30.0 onnxscript==0.7.2 numpy
          python scripts/android/modelo_demucs.py modelo --fp16

      - name: Bibliotecas de Java para las pruebas
        working-directory: .
        run: |
          mkdir -p java-libs
          curl -sSfL -o java-libs/onnxruntime.jar https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.30.0/onnxruntime-1.30.0.jar
          curl -sSfL -o java-libs/android-json.jar https://repo1.maven.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar

      - name: Probar el motor de la app contra Demucs original
        if: steps.modelo.outputs.cache-hit != 'true'
        working-directory: .
        run: python scripts/android/probar_motor.py modelo java-libs/onnxruntime.jar --segundos 20

      - name: Probar el "servidor" del celular (separar, analizar, pistas, exportar, cancelar, retomar)
        working-directory: .
        run: |
          mkdir -p build-java
          CP=java-libs/onnxruntime.jar:java-libs/android-json.jar
          javac -encoding UTF-8 -d build-java -cp "$CP" \
            frontend/android/app/src/main/java/com/moimoi/engine/*.java \
            frontend/android/app/src/main/java/com/moimoi/analysis/*.java \
            frontend/android/app/src/main/java/com/moimoi/local/*.java \
            scripts/android/PruebaLocal.java
          java -Xmx768m -cp "build-java:$CP" PruebaLocal modelo 4

      # ---- interfaz y app --------------------------------------------------------------------

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la interfaz
        run: npm run build

      - name: Copiar la interfaz a la app
        run: npx cap sync android

      - name: Copiar el modelo a la app
        run: |
          mkdir -p android/app/src/main/assets/models
          cp ../modelo/htdemucs_6s.onnx ../modelo/htdemucs_6s.json android/app/src/main/assets/models/
          ls -la android/app/src/main/assets/models

      - name: Compilar la app
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar el APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MoiMoi.apk
          ls -la MoiMoi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoiMoi-android
          path: frontend/MoiMoi.apk
          if-no-files-found: error

      - name: Publicar en la versión "android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="App de Android de MoiMoi (compilación ${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7}). Descarga MoiMoi.apk en el celular, ábrelo e instálalo (Android pide permiso para instalar apps de fuera de Play Store). La separación de pistas se hace en el mismo celular: no necesita computadora."
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --prerelease --target "$GITHUB_SHA" --title "MoiMoi para Android" --notes "$notes"
          fi
          gh release upload android MoiMoi.apk --clobber
          gh release edit android --notes "$notes"

  # Prueba la separación en un Android de verdad (emulador): decodificar con MediaCodec, cargar el
  # modelo desde el APK, separar con ONNX Runtime, guardar las pistas y exportar.
  emulador:
    name: Probar en un emulador de Android
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Modelo de separación (del paso anterior)
        uses: actions/cache/restore@v4
        with:
          path: modelo
          key: modelo-htdemucs_6s-${{ hashFiles('scripts/android/modelo_demucs.py') }}-torch2.14-demucs4.1.0
          fail-on-cache-miss: true

      - name: Interfaz y modelo en la app
        run: |
          npm ci
          npm run build
          npx cap sync android
          mkdir -p android/app/src/main/assets/models
          cp ../modelo/htdemucs_6s.onnx ../modelo/htdemucs_6s.json android/app/src/main/assets/models/

      - name: Audios de prueba (M4A estéreo a 48 kHz y MP3 mono a 22 kHz)
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          mkdir -p android/app/src/androidTest/assets
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=220:duration=10" -f lavfi -i "sine=frequency=330:duration=10" \
            -f lavfi -i "anoisesrc=duration=10:color=pink:amplitude=0.05" \
            -filter_complex "[0][1]amerge=inputs=2[s];[s][2]amix=inputs=2:duration=first" \
            -ar 48000 -ac 2 -c:a aac -b:a 128k android/app/src/androidTest/assets/prueba.m4a
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" -ar 22050 -ac 1 -c:a libmp3lame -b:a 64k \
            android/app/src/androidTest/assets/prueba.mp3
          ls -la android/app/src/androidTest/assets

      - name: Permitir KVM (acelera el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Separar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: frontend/android
          script: ./gradlew :app:connectedDebugAndroidTest -Pemulador --no-daemon --stacktrace && (adb logcat -d | grep "MoiMoi:" || true)

      - name: Resultados de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-emulador
          path: frontend/android/app/build/reports/androidTests/
          if-no-files-found: ignore
