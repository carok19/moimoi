# Compila la app de Android de MoiMoi (Capacitor) y la publica en la versión "android":
# https://github.com/carok19/moimoi/releases/tag/android
name: App Android

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la interfaz
        run: npm run build

      - name: Copiar la interfaz a la app
        run: npx cap sync android

      - name: Compilar la app
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MoiMoi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoiMoi-android
          path: frontend/MoiMoi.apk
          if-no-files-found: error

      - name: Publicar en la versión "android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="App de Android de MoiMoi (compilación ${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7}). Descarga MoiMoi.apk en el celular, ábrelo e instálalo (Android pide permiso para instalar apps de fuera de Play Store). Después escribe la dirección que muestra MoiMoi en la computadora."
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --prerelease --target "$GITHUB_SHA" --title "MoiMoi para Android" --notes "$notes"
          fi
          gh release upload android MoiMoi.apk --clobber
          gh release edit android --notes "$notes"
